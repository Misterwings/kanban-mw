services:
  app:
    build:
      context: ./docker/php
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_FAKER_LOCALE: es_ES
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: kanban
      DB_USERNAME: kanban
      DB_PASSWORD: kanban
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: kanban@localhost
      MAIL_FROM_NAME: Kanban MW
      KANBAN_TIMEZONE: America/Bogota
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kanban

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - kanban

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: kanban
      MYSQL_USER: kanban
      MYSQL_PASSWORD: kanban
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - kanban_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ukanban -pkanban --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kanban

  worker:
    build:
      context: ./docker/php
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: local
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: kanban
      DB_USERNAME: kanban
      DB_PASSWORD: kanban
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: kanban@localhost
      MAIL_FROM_NAME: Kanban MW
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kanban

  scheduler:
    build:
      context: ./docker/php
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: local
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: kanban
      DB_USERNAME: kanban
      DB_PASSWORD: kanban
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kanban

  vite:
    image: node:22-alpine
    working_dir: /var/www
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/var/www
      - kanban_node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    networks:
      - kanban

volumes:
  kanban_db:
  kanban_node_modules:

networks:
  kanban:
