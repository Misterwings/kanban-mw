x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: app
  restart: unless-stopped
  environment: &app-environment
    APP_NAME: ${APP_NAME:-Kanban MW}
    APP_ENV: production
    APP_KEY: ${APP_KEY:?}
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:?}
    APP_LOCALE: ${APP_LOCALE:-es}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-es}
    APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-es_ES}
    APP_MAINTENANCE_DRIVER: file
    BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-kanban}
    DB_USERNAME: ${DB_USERNAME:-kanban}
    DB_PASSWORD: ${DB_PASSWORD:?}
    SESSION_DRIVER: database
    SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
    SESSION_SECURE_COOKIE: "true"
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
    TRUSTED_PROXIES: "${TRUSTED_PROXIES:-*}"
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_SCHEME: ${MAIL_SCHEME:-}
    MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
    MAIL_PORT: ${MAIL_PORT:-2525}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Kanban MW}
    KANBAN_TIMEZONE: ${KANBAN_TIMEZONE:-America/Bogota}
    KANBAN_REMINDER_TIME: ${KANBAN_REMINDER_TIME:-08:00}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kanban}
      MYSQL_USER: ${DB_USERNAME:-kanban}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - kanban_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *app
    volumes:
      - kanban_storage:/var/www/storage/app/public
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    volumes:
      - kanban_storage:/var/www/storage/app/public
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - kanban_storage:/var/www/storage/app/public:ro
    depends_on:
      app:
        condition: service_started

volumes:
  kanban_mysql:
  kanban_storage:
